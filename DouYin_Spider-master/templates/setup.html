<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号配置 - 爆款工坊</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  max-width: 680px;
  width: 100%;
  padding: 40px 24px;
}
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 40px;
  backdrop-filter: blur(12px);
}
h1 { font-size: 24px; margin-bottom: 8px; color: #f1f5f9; }
.subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 32px; }
.steps { margin-bottom: 32px; }
.step {
  display: flex; gap: 16px; align-items: flex-start;
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.step:last-child { border-bottom: none; }
.step-num {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px;
  flex-shrink: 0;
}
.step-content { flex:1; }
.step-content h3 { font-size: 15px; margin-bottom: 4px; color: #e2e8f0; }
.step-content p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
.bookmarklet-box {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 12px;
  padding: 20px 24px;
  text-align: center;
  margin: 24px 0;
  cursor: grab;
  user-select: none;
  transition: transform 0.2s, box-shadow 0.2s;
}
.bookmarklet-box:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(99,102,241,0.3);
}
.bookmarklet-box .label { font-size: 12px; opacity: 0.8; margin-bottom: 6px; }
.bookmarklet-box .title { font-size: 18px; font-weight: 700; }
.bookmarklet-box .hint { font-size: 12px; opacity: 0.7; margin-top: 6px; }
.note {
  background: rgba(234,179,8,0.1);
  border: 1px solid rgba(234,179,8,0.2);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: #fbbf24;
  margin-top: 20px;
}
.note strong { color: #fde68a; }
a { color: #818cf8; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>账号配置</h1>
    <p class="subtitle">自动获取抖音 Cookie 和 Ticket，无需手动复制粘贴</p>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-content">
          <h3>拖拽下方按钮到书签栏</h3>
          <p>用鼠标按住按钮，拖到浏览器书签栏上</p>
        </div>
      </div>

      <div class="bookmarklet-box" id="bookmarklet"
        title="拖我到书签栏">
        <div class="label">书签工具</div>
        <div class="title">获取抖音配置</div>
        <div class="hint">拖拽此按钮到书签栏 ↑</div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-content">
          <h3>打开抖音并登录</h3>
          <p>新标签页打开 <a href="https://www.douyin.com" target="_blank">www.douyin.com</a>，完成登录</p>
        </div>
      </div>

      <div class="step">
        <div class="step-num">3</div>
        <div class="step-content">
          <h3>在抖音页面点击书签</h3>
          <p>登录后，在抖音页面点击书签栏的「获取抖音配置」，弹窗提示成功即可</p>
        </div>
      </div>

      <div class="step">
        <div class="step-num">4</div>
        <div class="step-content">
          <h3>重启服务</h3>
          <p>配置会自动保存到 .env 文件，回到终端重启服务即可生效</p>
        </div>
      </div>
    </div>

    <div class="note">
      <strong>提示：</strong>如果书签栏没显示，按 <strong>Ctrl+Shift+B</strong> 显示书签栏。
      拖拽后确保书签确实被添加了再继续。
    </div>
  </div>
</div>

<script>
// 构建书签工具
var bookmarkletCode = [
  'javascript:(function(){',
  'var d={cookies:document.cookie,ticket:"",ts_sign:"",private_key:"",client_cert:""};',
  '(document.cookie.split(";")||[]).forEach(function(c){',
  '  c=c.trim();',
  '  if(c.indexOf("bd_ticket_guard_client_data_v2=")===0){',
  '    try{',
  '      var raw=decodeURIComponent(c.split("=").slice(1).join("=")),parsed=JSON.parse(raw);',
  '      function f(o,k){',
  '        if(!o||typeof o!=="object")return null;',
  '        if(o[k]!==undefined)return o[k];',
  '        for(var i in o){var r=f(o[i],k);if(r!==null)return r;}',
  '        return null;',
  '      };',
  '      d.ticket=f(parsed,"ticket")||"";',
  '      d.ts_sign=f(parsed,"ts_sign")||"";',
  '      d.client_cert=f(parsed,"client_cert")||"";',
  '      d.private_key=f(parsed,"private_key")||f(parsed,"ec_privateKey")||"";',
  '    }catch(e){}',
  '  }',
  '});',
  'fetch("http://127.0.0.1:5000/api/save_auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})',
  '.then(function(r){return r.json()})',
  '.then(function(r){alert(r.success?"配置已保存！请重启服务":"失败: "+(r.error||""))})',
  '.catch(function(e){alert("请求失败，请确保服务已启动: "+e.message)});',
  '})();'
].join('');

document.getElementById('bookmarklet').setAttribute('href', bookmarkletCode);
document.getElementById('bookmarklet').style.cursor = 'grab';
</script>
</body>
</html>
