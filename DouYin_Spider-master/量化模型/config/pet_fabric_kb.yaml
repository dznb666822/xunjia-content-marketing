# 人类时尚元素 → 宠物适配（阶段 A 静态映射，配合豆包做"人→宠"迁移打分）
element_mapping:
  - human_element: 复古格纹
    pet_adaptability: high
    note: 秋冬外套/马甲，版型易改造
  - human_element: 新中式立领盘扣
    pet_adaptability: high
    note: 宠物汉服/旗袍，高端感强
  - human_element: 廓形羽绒
    pet_adaptability: medium
    note: 注意宠物活动自由度
  - human_element: 机能工装
    pet_adaptability: medium
    note: 口袋/拉链需简化
  - human_element: 蕾丝纱裙
    pet_adaptability: low
    note: 易勾挂，耐用性差
  - human_element: 毛呢大衣
    pet_adaptability: high
    note: 客单价高，适合高定
  - human_element: 学院风针织
    pet_adaptability: high
    note: 毛衣/开衫，日常实穿

# 宠物版型改造适配要点
silhouette:
  high_end_notes:
    - 预留胸背活动余量，避免束缚前肢
    - 采用可调节魔术贴/按扣，适应不同犬猫体型
    - 面料亲肤透气，内衬软质
  cost_note: 高定宠物服饰面料与工艺成本通常为成人同款的 60%~80%
